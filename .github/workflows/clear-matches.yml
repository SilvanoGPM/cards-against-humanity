name: Finalizar partidas todos os dias

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Apenas contar, sem escrever nada'
        type: boolean
        default: false
      max_age_hours:
        description: 'Idade mínima da partida para encerrar (0 = todas)'
        type: string
        default: '6'
  schedule:
    - cron: '0 11 * * *' # 11h UTC / 8h Brasil / 4h Pacific Time (fuso da quota do Firebase)

jobs:
  executar-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Instalar dependências
        # O script usa apenas firebase-admin (dependency); as devDependencies
        # (incluindo o firebase-tools) não fazem falta aqui e pesariam no job.
        run: npm ci --omit=dev

      - name: Criar Service Account Key
        run: printenv FIREBASE_SERVICE_ACCOUNT_KEY > ./scripts/serviceAccountKey.json
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Executar Script
        run: node ./scripts/finish-matches.js
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_AGE_HOURS: ${{ inputs.max_age_hours || '6' }}

      - name: Remover Service Account Key
        if: always()
        run: rm -f ./scripts/serviceAccountKey.json
